name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  quality:
    name: Required workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install exact Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Resolve pnpm cache boundary
        id: pnpm-cache
        shell: bash
        run: echo "store=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm content-addressed store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frozen workspace
        run: corepack pnpm install --frozen-lockfile

      - name: Run root verification gate
        run: corepack pnpm verify

  android-release:
    name: Android release configurations
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install exact Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.21.0 --activate

      - name: Install exact Java version
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.20'

      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Install locked Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006'

      - name: Resolve pnpm cache boundary
        id: pnpm-cache
        shell: bash
        run: echo "store=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm content-addressed store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frozen workspace
        run: corepack pnpm install --frozen-lockfile

      - name: Build Android product scaffold
        run: corepack pnpm build:mobile:android

      - name: Build isolated Android capability spike
        run: corepack pnpm build:spike:android
